[project]
name = "mai"
version = "2.0.0"
description = "mai (Mail for AI): a real mail server with an MCP overlay, for multi-agent delivery"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
dependencies = [
  "psycopg>=3.2",
  "bcrypt>=4.2",
  "bustan[starlette]==2.0.3",
]

[project.scripts]
mai = "mai.app_cli:main"
mai-serve = "mai.app_main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.17.4",
    "ty>=0.0.101",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
