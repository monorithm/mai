# Dovecot 2.4 for mai. Rendered by the controller at each start.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp
listen = *
base_dir = /run/dovecot
state_dir = /data/dovecot
log_path = /dev/stderr
info_log_path = /dev/stdout

mail_driver = maildir
mail_home = /data/mail/%{user | username | lower}
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 10002
last_valid_uid = 10002
mail_attribute {
  dict file {
    path = %{home}/dovecot-attributes
  }
}

mail_plugins {
  acl = yes
}
acl_driver = vfile
acl_sharing_map {
  dict file {
    path = /data/dovecot/shared-mailboxes.db
  }
}

auth_mechanisms = plain login
auth_allow_cleartext = yes
auth_username_format = %{user | username | lower}

ssl = yes
ssl_server_cert_file = /data/tls/cert.pem
ssl_server_key_file = /data/tls/key.pem
ssl_min_protocol = TLSv1.2

sql_driver = pgsql
pgsql /run/postgresql {
  parameters {
    dbname = mai
    user = dovecot
  }
}

passdb sql {
  query = SELECT login AS "user", password_hash AS password FROM mail_auth.principal WHERE login = '%{user | username | lower}' AND kind IN ('session','owner','system') AND status IN ('issued','active') AND (expires_at IS NULL OR expires_at > now())
}

userdb sql {
  query = SELECT login AS "user", 10002 AS uid, 10002 AS gid, '/data/mail/' || login AS home FROM mail_auth.principal WHERE login = '%{user | username | lower}'
  iterate_query = SELECT login AS "user" FROM mail_auth.principal
}

namespace inbox {
  type = private
  separator = /
  inbox = yes
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Done {
    auto = create
  }
}

namespace shared {
  type = shared
  separator = /
  prefix = shared/$user/
  mail_driver = maildir
  mail_path = %{owner_home}/Maildir
  mail_index_private_path = ~/Maildir/shared/%{owner_user}
  list = children
  subscriptions = no
}

protocol imap {
  mail_plugins {
    imap_acl = yes
  }
  mail_max_userip_connections = 50
}

protocol lmtp {
  # Postfix writes the Received header with the SASL login; it must stay the top header.
  lmtp_add_received_header = no
  auth_username_format = %{user | username | lower}
}

# The container has no CAP_SYS_CHROOT, thus no service uses chroot.
service imap-login {
  chroot =
  inet_listener imap {
    listen = 127.0.0.1
    port = 1143
  }
  inet_listener imaps {
    port = 1993
    ssl = yes
  }
}

service lmtp {
  unix_listener @MAI_SPOOL@/queue/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth {
  unix_listener @MAI_SPOOL@/queue/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

# The app runs as mai and sends each doveadm mail command to this socket.
# The doveadm server runs as root and enforces the ACL of the user that -u names.
# The socket accepts only the commands of the app: the router moves a reply,
# and the credentials module sets and removes the ACL of a session. A root
# command in the container (import, restore) uses a local doveadm, not this socket.
doveadm_allowed_commands = move "acl set" "acl delete" "acl get"

service doveadm {
  unix_listener doveadm-server {
    mode = 0600
    user = mai
  }
}

service anvil {
  chroot =
}
