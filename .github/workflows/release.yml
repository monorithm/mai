# Release: on a tag vX.Y.Z, run CI, build the distributions, push the container
# image to the GitHub Container Registry with the tags X.Y.Z, X.Y and X (image.yml,
# for linux/amd64 and linux/arm64), and publish a GitHub release with the notes
# of that version from CHANGELOG.md.
# Steps to make a tag: docs/how-to/make-a-release.md.

name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.6"

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Check that the tag is the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$TAG" ]; then
            echo "The tag $TAG is not v$version from pyproject.toml." >&2
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: [version, ci]
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write

  publish:
    name: Publish ${{ github.ref_name }}
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"

      - name: Take the notes of this version from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $version." >&2
            exit 1
          fi

      - run: uv build

      - name: Publish the GitHub release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --verify-tag
