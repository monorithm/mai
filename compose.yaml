name: mai
services:
  mai:
    # "docker compose pull" gets this image from the registry.
    # "docker compose build" makes it locally from the Dockerfile.
    image: ghcr.io/monorithm/mai:${MAI_TAG:-latest}
    container_name: mai
    build: .
    init: false
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    ports:
      - "127.0.0.1:8765:8080"
      - "127.0.0.1:1993:1993"
      - "127.0.0.1:1587:1587"
    volumes:
      # The data of mai: the database, the mail, the secrets, and the backups. With no
      # MAI_DATA_DIR, the named volume mai-data holds it. To keep it in a folder on the
      # host, set MAI_DATA_DIR to an absolute path, or to a path that starts with ./ .
      - ${MAI_DATA_DIR:-mai-data}:/data
      # The Postfix queue and its Unix sockets stay on a volume on each OS: a host folder
      # on macOS or Windows can hold no Unix socket.
      - mai-spool:/var/lib/mai/spool
    tmpfs: [/run, /tmp, /etc/postfix, /etc/dovecot]
    stop_grace_period: 60s
volumes:
  mai-data: {}
  mai-spool: {}
